version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 10
    groups:
      django:
        patterns:
          - "django*"
      linting:
        patterns:
          - "ruff"
          - "mypy*"
          - "types-*"
          - "pre-commit"
      testing:
        patterns:
          - "pytest*"
          - "coverage"
      security:
        patterns:
          - "bandit"
          - "pip-audit"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
